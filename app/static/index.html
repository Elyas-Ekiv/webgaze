<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webpage Attention</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
  <header>
    <p class="eyebrow">Webpage attention</p>
    <h1>Where people look</h1>
    <p>Drop a screenshot or paste a URL. The model fuses the page image with layout regions and draws a saliency heatmap.</p>
  </header>
  <main class="layout">
    <section class="panel">
      <label for="file">Screenshot</label>
      <input id="file" type="file" accept="image/*">
      <label for="url">Page URL</label>
      <input id="url" type="url" placeholder="https://example.com">
      <div class="actions">
        <button id="predict" type="button">Predict</button>
        <button id="sample" class="secondary" type="button">Sample</button>
      </div>
      <p class="status" id="status"></p>
    </section>
    <section class="panel stage">
      <div class="stage-inner">
        <div class="toolbar">
          <span>Model <strong id="model-name">—</strong></span>
          <label>Heatmap <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.5"></label>
          <label class="check"><input id="boxes" type="checkbox" checked> Regions</label>
        </div>
        <canvas id="view" width="768" height="432"></canvas>
        <div class="regions" id="regions"></div>
      </div>
    </section>
  </main>
  <script src="/static/app.js?v=4"></script>
</body>
</html>
